[project]
name = "chordscribe-engine"
version = "0.1.0"
description = "Automatic guitar chord recognition engine for ChordScribe"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# vendor/ holds third-party code (BTC) kept close to upstream — don't lint it.
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
